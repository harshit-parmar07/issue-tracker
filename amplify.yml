version: 1
frontend:
  phases:
    preBuild:
      commands:
        - env | grep -E "^(NEXTAUTH_SECRET|NEXTAUTH_URL|DATABASE_URL|GOOGLE_CLIENT_ID|GOOGLE_CLIENT_SECRET)=" >> .env.production
        - npm ci
    build:
      commands:
        - npx prisma generate
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
